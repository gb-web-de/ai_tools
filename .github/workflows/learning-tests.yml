name: Learning Regression Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite, xml
          coverage: none
          tools: composer
      - run: npm ci --prefix typo3-mcp-server --workspaces=false --ignore-scripts
      - run: composer install --working-dir=typo3-security-suite --no-interaction --prefer-dist --no-plugins --no-scripts
      - run: npm test
      # Informational: shows which regression fixtures still lack a human
      # sign-off. Switch to `npm run fixtures:status -- --require-approved` once
      # the corpus has been reviewed, to keep unreviewed pairs out of the gate.
      - name: Fixture review status
        run: npm run fixtures:status
